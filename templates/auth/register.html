{% extends "base.html" %}

{% block title %}Register | Pyrello{% endblock %}

{% block content %}
<div class="mx-auto max-w-md rounded-2xl border border-slate-800 bg-slate-900/70 p-8 shadow-xl">
  <h1 class="text-2xl font-bold text-blue-200">Create Account</h1>
  <p class="mt-1 text-sm text-slate-400">Register a user to start collaborating.</p>

  <form method="post" class="mt-6 space-y-4">
    <div>
      <label class="mb-1 block text-sm text-slate-300" for="username">Username</label>
      <input
        id="username"
        name="username"
        required
        minlength="3"
        maxlength="40"
        class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-sm outline-none ring-blue-500 placeholder:text-slate-500 focus:ring"
        placeholder="team_member"
      >
    </div>
    <div>
      <label class="mb-1 block text-sm text-slate-300" for="password">Password</label>
      <input
        id="password"
        name="password"
        type="password"
        required
        minlength="6"
        class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-sm outline-none ring-blue-500 placeholder:text-slate-500 focus:ring"
        placeholder="At least 6 characters"
      >
    </div>
    <div>
      <label class="mb-1 block text-sm text-slate-300" for="confirm_password">Confirm Password</label>
      <input
        id="confirm_password"
        name="confirm_password"
        type="password"
        required
        class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-sm outline-none ring-blue-500 placeholder:text-slate-500 focus:ring"
        placeholder="Re-enter password"
      >
    </div>
    <button type="submit" class="w-full rounded-lg bg-blue-600 px-4 py-2 font-medium hover:bg-blue-500">
      Register
    </button>
  </form>

  <p class="mt-4 text-sm text-slate-400">
    Already have account?
    <a class="text-blue-300 hover:text-blue-200" href="{{ url_for('auth.login') }}">Login</a>
  </p>
</div>
{% endblock %}
